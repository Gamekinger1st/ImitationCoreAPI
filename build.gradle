plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
    id 'eclipse'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def generatedGameTestResources = layout.buildDirectory.dir("generated/gametest-resources")
def generateGameTestStructure = tasks.register("generateGameTestStructure") {
    def outputFile = generatedGameTestResources.map { it.file("data/${mod_id}/structure/empty.nbt") }
    outputs.file(outputFile)
    doLast {
        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        new DataOutputStream(new java.util.zip.GZIPOutputStream(new FileOutputStream(target))).withCloseable { nbt ->
            nbt.writeByte(10)
            nbt.writeUTF("")
            nbt.writeByte(3)
            nbt.writeUTF("DataVersion")
            nbt.writeInt(3955)
            nbt.writeByte(9)
            nbt.writeUTF("size")
            nbt.writeByte(3)
            nbt.writeInt(3)
            nbt.writeInt(5)
            nbt.writeInt(5)
            nbt.writeInt(5)
            nbt.writeByte(9)
            nbt.writeUTF("palette")
            nbt.writeByte(10)
            nbt.writeInt(1)
            nbt.writeByte(8)
            nbt.writeUTF("Name")
            nbt.writeUTF("minecraft:air")
            nbt.writeByte(0)
            nbt.writeByte(9)
            nbt.writeUTF("blocks")
            nbt.writeByte(10)
            nbt.writeInt(0)
            nbt.writeByte(9)
            nbt.writeUTF("entities")
            nbt.writeByte(10)
            nbt.writeInt(0)
            nbt.writeByte(0)
        }
    }
}
sourceSets.main.resources.srcDir(generatedGameTestResources)

repositories {
    mavenCentral()
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://maven.architectury.dev/' }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation files(sourceSets.main.compileClasspath)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly files(sourceSets.main.runtimeClasspath)
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn(generateGameTestStructure)
    def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]
    inputs.properties(replaceProperties)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand(replaceProperties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def generatedRefmap = layout.buildDirectory.file("generated/refmap/${mod_id}.refmap.json")
def generateRefmap = tasks.register('generateRefmap') {
    outputs.file(generatedRefmap)
    doLast {
        def target = generatedRefmap.get().asFile
        target.parentFile.mkdirs()
        target.setText('{"mappings":{},"data":{}}\n', 'UTF-8')
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn(generateRefmap)
    from(generatedRefmap)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def publicApiSources = layout.projectDirectory.dir('src/main/java/com/github/gamekinger1st/imitationcoreapi/api').asFileTree.matching {
    include '**/*.java'
}

tasks.register('verifyPublicApiBoundary') {
    inputs.files(publicApiSources)
    doLast {
        def violations = inputs.files.files.findAll { source -> source.getText('UTF-8').contains('.imitationcoreapi.internal.') }
        if (!violations.isEmpty()) {
            throw new GradleException("Public API sources must not depend on internal implementation packages: ${violations*.path.join(', ')}")
        }
    }
}

tasks.register('verifyReleaseJar') {
    dependsOn(tasks.named('jar'))
    def releaseJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(releaseJar)
    doLast {
        def archive = new java.util.zip.ZipFile(releaseJar.get().asFile)
        try {
            def names = archive.entries().collect { it.name }.toSet()
            def required = [
                    'META-INF/neoforge.mods.toml',
                    'pack.mcmeta',
                    'imitationcoreapi.mixins.json',
                    'imitationcoreapi.compat.mixins.json',
                    'imitationcoreapi.refmap.json',
                    'assets/imitationcoreapi/lang/en_us.json'
            ]
            def missing = required.findAll { !names.contains(it) }
            if (!missing.isEmpty()) {
                throw new GradleException("Release jar is missing required entries: ${missing.join(', ')}")
            }
            def forbidden = names.findAll { name ->
                name.startsWith('run/') || name.endsWith('latest.log') || name.endsWith('imitationcoreapi-discord.properties')
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException("Release jar contains runtime or credential files: ${forbidden.join(', ')}")
            }
            def metadata = archive.getInputStream(archive.getEntry('META-INF/neoforge.mods.toml')).getText('UTF-8')
            if (!metadata.contains('version="0.5.0"')) {
                throw new GradleException('Release metadata does not declare version 0.5.0')
            }
        } finally {
            archive.close()
        }
    }
}

tasks.named('check') {
    dependsOn(tasks.named('verifyPublicApiBoundary'), tasks.named('verifyReleaseJar'))
}
