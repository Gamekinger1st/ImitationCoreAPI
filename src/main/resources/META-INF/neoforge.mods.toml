modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayTest="IGNORE_SERVER_VERSION"
features={java_version="[21,)"}
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="optional"
versionRange="[4.8,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="manascore"
type="optional"
versionRange="[4,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tensura"
type="optional"
versionRange="[2,)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="imitationcoreapi.mixins.json"

[[mixins]]
config="imitationcoreapi.compat.mixins.json"
